name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Publicación automática de lo que se cambia en el panel de administración:
  # cada 15 minutos se compara la huella de los datos de Supabase con la de la
  # web publicada y, solo si cambió algo, se vuelve a publicar. Minutos poco
  # concurridos: GitHub retrasa o salta las tareas de los minutos :00/:15/:30/:45.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      cambio: ${{ steps.comparar.outputs.cambio }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comparar datos con la web publicada
        id: comparar
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          actual=$(node scripts/huella-datos.mjs)
          publicada=$(curl -fsSL "https://www.sky.com.pe/huella-datos.txt?t=$(date +%s)" || echo "sin-huella")
          echo "Datos: $actual | Publicada: $publicada"
          if [ "$actual" != "$publicada" ]; then echo "cambio=true" >> "$GITHUB_OUTPUT"; else echo "cambio=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: revisar
    if: github.event_name != 'schedule' || needs.revisar.outputs.cambio == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Huella de los datos publicados
        run: node scripts/huella-datos.mjs > huella-datos.txt
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build && cp huella-datos.txt dist/huella-datos.txt
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
